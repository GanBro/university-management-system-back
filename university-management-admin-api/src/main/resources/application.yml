spring:
  datasource:
    url: jdbc:mysql://localhost:3306/university_management
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  security:
    user:
      name: admin
      password: admin123
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  mvc:
    static-path-pattern: /**

file:
  upload:
    # Windows 系统路径
    path: E:\\Code\\IDEA\\university-management-system-back\\uploads\\
    # 分类存储
    logo-path: ${file.upload.path}logos\\
    avatar-path: ${file.upload.path}avatars\\
    # 访问URL前缀
    url-prefix: /files/
    logo-url-prefix: ${file.upload.url-prefix}logos/
    avatar-url-prefix: ${file.upload.url-prefix}avatars/

mybatis-plus:
  type-handlers-package: com.wubo.api.enums
  type-aliases-package: com.wubo.api.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      table-prefix:
      id-type: auto
