spring:
  datasource:
    url: jdbc:mysql://localhost:3306/university_management
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  security:
    user:
      name: admin
      password: admin123
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  mvc:
    static-path-pattern: /files/**

file:
  upload:
    # Windows 系统路径使用双反斜杠
    path: E:\\Code\\IDEA\\university-management-system-back\\uploads\\
    url-prefix: /files/
mybatis-plus:
  type-handlers-package: com.wubo.api.enums
  type-aliases-package: com.wubo.api.entity
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      # 设置实体类所对应的表的统一前缀
      table-prefix:
      # 设置统一的主键生成策略
      id-type: auto

